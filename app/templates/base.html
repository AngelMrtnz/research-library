<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Research Library{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100">
  <header class="border-b border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800">
    <nav class="mx-auto flex max-w-6xl items-center gap-6 px-4 py-3 text-sm">
      <a href="/" class="font-semibold tracking-tight">📚 Research Library</a>
      <a href="/" class="hover:text-blue-600">Library</a>
      <a href="/staging" class="hover:text-blue-600">Review{% if staged %} <span class="rounded-full bg-amber-100 px-2 text-amber-800">{{ staged }}</span>{% endif %}</a>
      <a href="/tags" class="hover:text-blue-600">Tags</a>
      {% if auth_on %}<a href="/logout" class="ml-auto text-slate-500 hover:text-slate-800 dark:hover:text-white">Sign out</a>{% endif %}
    </nav>
  </header>
  <main class="mx-auto max-w-6xl px-4 py-6">
    {% if msg %}<div class="mb-4 rounded-md bg-emerald-50 px-4 py-2 text-sm text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-200">{{ msg }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <div id="drop" class="pointer-events-none fixed inset-0 z-50 hidden items-center justify-center bg-blue-600/20 backdrop-blur-sm">
    <div class="rounded-2xl border-2 border-dashed border-blue-500 bg-white px-10 py-8 text-center text-lg font-medium text-blue-700 shadow-xl dark:bg-slate-800 dark:text-blue-300">
      <span id="drop-text">Drop PDFs to add them to Review</span>
    </div>
  </div>
  <script>
    // Drag PDFs onto any page: they go to the Inbox and show up in Review.
    const drop = document.getElementById("drop");
    let depth = 0;
    const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
    const show = (on) => { drop.classList.toggle("hidden", !on); drop.classList.toggle("flex", on); };
    addEventListener("dragenter", (e) => { if (hasFiles(e)) { depth++; show(true); } });
    addEventListener("dragleave", (e) => { if (hasFiles(e) && --depth <= 0) { depth = 0; show(false); } });
    addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
    addEventListener("drop", (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault(); depth = 0;
      uploadPdfs(e.dataTransfer.files);
    });
    async function uploadPdfs(files) {
      const pdfs = [...files].filter((f) => f.name.toLowerCase().endsWith(".pdf"));
      if (!pdfs.length) { show(false); return; }
      show(true);
      document.getElementById("drop-text").textContent = `Adding ${pdfs.length} PDF${pdfs.length > 1 ? "s" : ""}…`;
      const body = new FormData();
      pdfs.forEach((f) => body.append("files", f));
      const r = await fetch("/upload", { method: "POST", body });
      location.href = r.ok ? r.url : "/staging?msg=Upload+failed";
    }
  </script>
</body>
</html>
