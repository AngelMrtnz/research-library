{% extends "base.html" %}
{% block content %}
<div class="flex flex-col gap-3 sm:flex-row sm:items-center">
  <div class="relative w-full">
  <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4" stroke-linecap="round"/></svg>
  <input type="search" name="q" value="{{ q }}" autofocus placeholder="Search"
         class="w-full rounded-lg border border-slate-300 bg-white py-2 pl-9 pr-4 shadow-sm focus:border-blue-500 focus:outline-none dark:border-slate-600 dark:bg-slate-800"
         hx-get="/" hx-trigger="input changed delay:200ms, search" hx-target="#results" hx-push-url="true"
         hx-include="#active-tags">
  </div>
  <a href="/export.bib?{{ export_qs }}" download title="Download BibTeX of the papers shown (all papers when nothing is filtered)"
     class="inline-flex shrink-0 items-center gap-1 self-end rounded-md border border-slate-300 bg-white px-2 py-1 text-xs text-slate-600 hover:bg-slate-100 sm:self-auto dark:border-slate-600 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700"><svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v10m-4-4 4 4 4-4M4 17h12"/></svg>.bib</a>
</div>
<div id="active-tags">{% for t in active %}<input type="hidden" name="tag" value="{{ t }}">{% endfor %}</div>

<div id="results" class="mt-4">{% include "partials/results.html" %}</div>
<script>
  // Tag row: one line of the most common tags; "All tags" opens the rest.
  function setupTagRow() {
    const row = document.getElementById("tag-row"), more = document.getElementById("tag-more");
    if (!row || !more) return;
    more.classList.toggle("hidden", row.scrollHeight <= row.clientHeight + 2 && !row.dataset.open);
    more.onclick = () => {
      row.dataset.open = row.dataset.open ? "" : "1";
      row.classList.toggle("max-h-7", !row.dataset.open);
      more.textContent = row.dataset.open ? "Fewer" : more.dataset.label;
    };
  }
  document.addEventListener("DOMContentLoaded", setupTagRow);
  document.addEventListener("htmx:afterSwap", setupTagRow);
  addEventListener("resize", setupTagRow);
</script>
{% endblock %}
