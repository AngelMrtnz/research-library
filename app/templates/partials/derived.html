{% set input = "w-full rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm focus:border-blue-500 focus:outline-none dark:border-slate-600 dark:bg-slate-900" %}
{% set label = "mb-1 block text-xs font-medium text-slate-500" %}
<div class="grid gap-3 sm:grid-cols-3">
  <div><label class="mb-1 block text-xs font-medium text-slate-500">Citation key</label>
    <input name="key" value="{{ key }}" class="{{ input }} font-mono"></div>
  <div class="sm:col-span-2"><label class="{{ label }}">Filename</label>
    <input name="filename" value="{{ filename }}" class="{{ input }}"></div>
</div>
<div><label class="{{ label }}">BibTeX</label>
  <textarea name="bibtex" rows="10" class="{{ input }} font-mono text-xs">{{ bibtex }}</textarea></div>
