  {% for paper, e, ptags in papers %}
  <li class="p-4">
    <div class="flex flex-wrap items-baseline gap-x-3">
      <a href="/papers/{{ paper.id }}/pdf/{{ paper.filename | urlencode }}?v={{ paper.file_id }}" target="_blank" class="font-medium hover:text-blue-600">{{ e.title | tex }}</a>
      <span class="text-sm text-slate-500">{{ e.year }}</span>
      <code class="ml-auto cursor-pointer rounded bg-slate-100 px-2 text-xs dark:bg-slate-700" title="Copy key"
            onclick="navigator.clipboard.writeText('{{ e.key }}')">{{ e.key }}</code>
    </div>
    <div class="text-sm text-slate-600 dark:text-slate-300">{{ e.authors | names }}{% if e.journal %} · <i>{{ e.journal }}</i>{% endif %}</div>
    <div class="mt-1 truncate text-xs text-slate-400" title="{{ paper.filename }}">{{ paper.filename }}</div>
    <div class="mt-2 flex flex-wrap items-center gap-3">
      <div data-tag-editor data-url="/papers/{{ paper.id }}/tags" data-tags='{{ ptags | map(attribute="name") | list | tojson }}'></div>
      <div class="ml-auto flex gap-3 text-xs">
        <button class="text-slate-500 hover:text-blue-600" onclick="copyBib(this, {{ paper.id }})">Copy BibTeX</button>
        <a href="/staging/{{ paper.id }}" class="text-slate-500 hover:text-blue-600">Edit</a>
        <button class="text-slate-400 hover:text-rose-600" hx-post="/papers/{{ paper.id }}/delete"
                hx-confirm="Delete this paper? The PDF moves to Papers/_Deleted and it leaves library.bib."
                hx-target="closest li" hx-swap="outerHTML">Delete</button>
      </div>
    </div>
  </li>
  {% endfor %}
  {% if more_qs %}
  <li class="p-3 text-center"><button class="text-sm text-blue-600 hover:underline" hx-get="/?{{ more_qs }}"
      hx-target="closest li" hx-swap="outerHTML">Show more</button></li>
  {% endif %}
