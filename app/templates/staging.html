{% extends "base.html" %}
{% block title %}Review · Research Library{% endblock %}
{% block content %}
<div class="flex flex-col gap-4 sm:flex-row sm:items-end">
  <div>
    <h1 class="text-xl font-semibold">Staging / Review</h1>
    <p class="text-sm text-slate-500">Nothing is renamed until you open a paper and click <b>Confirm &amp; Rename</b>.</p>
  </div>
  <form method="post" action="/scan" class="sm:ml-auto">
    <button class="rounded-lg bg-slate-800 px-4 py-2 text-sm text-white hover:bg-slate-700 dark:bg-slate-200 dark:text-slate-900">Scan inbox</button>
  </form>
  <form method="post" action="/upload" enctype="multipart/form-data" class="flex items-center gap-2">
    <input type="file" name="files" accept="application/pdf" multiple required class="text-sm">
    <button class="rounded-lg border border-slate-300 px-4 py-2 text-sm hover:bg-slate-100 dark:border-slate-600 dark:hover:bg-slate-700">Upload</button>
  </form>
</div>
<div id="rows" class="mt-6">{% include "partials/staging_rows.html" %}</div>
{% endblock %}
