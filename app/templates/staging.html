{% extends "base.html" %}
{% block title %}Review · Research Library{% endblock %}
{% block content %}
<div class="flex flex-col gap-4 sm:flex-row sm:items-center">
  <div>
    <h1 class="text-xl font-semibold">Review</h1>
  </div>
  <a href="/staging" title="Check the Inbox for new PDFs"
     class="sm:ml-auto inline-flex shrink-0 self-start items-center gap-2 rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm text-slate-600 shadow-sm hover:bg-slate-100 sm:self-auto dark:border-slate-600 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700">
    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3v4h-4"/></svg>Refresh</a>
  <label class="inline-flex shrink-0 self-start whitespace-nowrap sm:self-auto cursor-pointer items-center gap-2 rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-500">
    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>Add PDFs
    <input type="file" accept="application/pdf" multiple class="hidden" onchange="uploadPdfs(this.files); this.value = ''">
  </label>
</div>
<div id="rows" class="mt-6">{% include "partials/staging_rows.html" %}</div>
{% endblock %}
