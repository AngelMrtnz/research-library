{% extends "base.html" %}
{% block title %}Review · Research Library{% endblock %}
{% block content %}
<div class="flex flex-col gap-4 sm:flex-row sm:items-end">
  <div>
    <h1 class="text-xl font-semibold">Review</h1>
    <p class="text-sm text-slate-500">Drag PDFs onto any page to add them. Nothing is renamed until you click <b>Confirm &amp; Rename</b>.</p>
  </div>
  <label class="sm:ml-auto inline-flex shrink-0 self-start whitespace-nowrap sm:self-auto cursor-pointer items-center gap-2 rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-500">
    <span aria-hidden="true">＋</span> Add PDFs
    <input type="file" accept="application/pdf" multiple class="hidden" onchange="uploadPdfs(this.files)">
  </label>
</div>
<div id="rows" class="mt-6">{% include "partials/staging_rows.html" %}</div>
{% endblock %}
